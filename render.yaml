services:
  - type: web
    name: skillroute-india
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      npm ci --prefix frontend
      npm run build --prefix frontend
    startCommand: >
      PYTHONPATH=.
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port $PORT
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: NODE_VERSION
        value: 20.18.0
